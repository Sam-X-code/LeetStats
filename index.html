<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetStats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>LeetStats</h1>
        <div class="user-container">
            <div class="input-group">
                <input type="text" id="username" placeholder="Enter LeetCode username">
                <button id="fetch-btn">Fetch Stats</button>
        </div>

        <div class="stats-container">

            <div class="progress">
                <div class="progress-item">
                    <div class="easy-progress">
                        <span id="easy-label">easy</span>
                        
                    </div>    
                </div>
                <div class="progress-item">
                    <div class="medium-progress">
                        <span id="medium-label">medium</span>
                        
                    </div>
                </div>    
                <div class="progress-item">
                    <div class="hard-progress">
                        <span id="hard-label">hard</span>
                        
                    </div>
                </div>    

                <div class="stats">

                </div>
            </div>


        </div>




    <script src="script.js"></script>
</body>
</html>
