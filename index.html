<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetStats</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>LeetStats</h1>
        <div class="user-container">
            <div class="input-group">
                <input type="text" id="username" placeholder="Enter LeetCode username">
                <button id="fetch-btn">Fetch Stats</button>
            </div>
        </div>

        <div class="stats-container">

            <div class="progress">
                <div class="progress-item">
                    <div class="progress-circle total-progress">
                        <div id="total-label" class="progress-text">Total</div>
                    </div>   
                </div>
                <div class="progress-item">
                    <div class="progress-circle easy-progress">
                        <div id="easy-label" class="progress-text">Easy</div>
                    </div>   
                </div>
                <div class="progress-item">
                    <div class="progress-circle medium-progress">
                        <div id="medium-label" class="progress-text">Medium</div>
                    </div>
                </div>    
                <div class="progress-item">
                    <div class="progress-circle hard-progress">
                        <div id="hard-label" class="progress-text">Hard</div>
                    </div>
                </div>    

                
            </div>

            <div class="stats-cards">

            </div>


        </div>




    <script src="index.js"></script>
</body>
</html>
